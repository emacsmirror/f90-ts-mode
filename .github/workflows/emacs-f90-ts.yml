name: emacs f90-mode

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    strategy:
      matrix:
        include:
          # Emacs 30: build Emacs and tree-sitter 0.25 from source
          - emacs-version: "30.1"
            emacs-source: true
            tree-sitter-version: "0.25.10"

          - emacs-version: "30.2"
            emacs-source: true
            tree-sitter-version: "0.25.10"

          # Emacs 31: use Purcell's precompiled Emacs
          # and tree-sitter 0.26
          - emacs-version: "31"
            emacs-source: false
            tree-sitter-version: "0.26.11"

    steps:
      # -------------------------
      # Checkout repo
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v5

      # -------------------------
      # Install common dependencies
      # -------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            cmake \
            pkg-config \
            npm \
            curl

      # -------------------------
      # Install dependencies needed
      # for building Emacs 30
      # -------------------------
      - name: Install Emacs build dependencies
        if: matrix.emacs-source
        run: |
          sudo apt-get install -y \
            autoconf \
            automake \
            texinfo \
            libjansson-dev \
            libgnutls28-dev \
            libncurses-dev \
            libgccjit-13-dev

      # -------------------------
      # Build tree-sitter 0.25
      # -------------------------
      - name: Build tree-sitter 0.25
        if: matrix.emacs-source
        run: |
          git clone \
            --depth 1 \
            --branch v${{ matrix.tree-sitter-version }} \
            https://github.com/tree-sitter/tree-sitter.git

          cd tree-sitter

          make -j$(nproc)
          make PREFIX=$HOME/local install

          echo "LD_LIBRARY_PATH=$HOME/local/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$HOME/local/lib:$LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "CPATH=$HOME/local/include:$CPATH" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$HOME/local/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

      # -------------------------
      # Build Emacs 30
      # -------------------------
      - name: Build Emacs ${{ matrix.emacs-version }}
        if: matrix.emacs-source
        run: |
          git clone \
            --depth 1 \
            --branch emacs-${{ matrix.emacs-version }} \
            https://github.com/emacs-mirror/emacs.git

          cd emacs

          ./autogen.sh

          ./configure \
            LDFLAGS="-Wl,-rpath,$HOME/local/lib" \
            CPPFLAGS="-I$HOME/local/include" \
            --prefix=$HOME/emacs \
            --with-tree-sitter \
            --with-gnutls \
            --without-x \
            --without-sound \
            --without-sqlite3 \
            --without-xml2 \
            --without-mailutils \
            --without-pop \
            --without-native-compilation \
            --without-compress-install \
            CFLAGS="-O2"

          make -j$(nproc)
          make install

          echo "$HOME/emacs/bin" >> "$GITHUB_PATH"

      # -------------------------
      # Install Emacs 31 (precompiled)
      # -------------------------
      - name: Install Emacs 31
        if: "!matrix.emacs-source"
        uses: purcell/setup-emacs@master
        with:
          version: '31.1'

      # -------------------------
      # Verify Emacs
      # -------------------------
      - name: Verify Emacs
        run: |
          which emacs
          emacs --version

      # -------------------------
      # Verify tree-sitter support
      # -------------------------
      - name: Verify tree-sitter
        run: |
          emacs --batch -Q \
            --eval "(progn
              (princ (format \"Emacs: %s\n\" emacs-version))
              (princ
               (format
                \"Tree-sitter library ABI: %s\n\"
                (treesit-library-abi-version)))

              (unless (treesit-available-p)
                (error \"Tree-sitter is not available\")))"

      # -------------------------
      # Verify Emacs 30 linkage
      # -------------------------
      - name: Verify tree-sitter linkage
        if: matrix.emacs-source
        run: |
          EMACS_BIN=$(which emacs)

          echo "Emacs binary: $EMACS_BIN"

          LDD_OUT=$(ldd "$EMACS_BIN" | grep libtree-sitter || true)

          echo "tree-sitter linkage:"
          echo "$LDD_OUT"

          if [ -z "$LDD_OUT" ]; then
            echo "Error: Emacs is not linked against libtree-sitter"
            exit 1
          fi

      # -------------------------
      # Verify Emacs 31 linkage
      # -------------------------
      #
      # This is useful once the Purcell URL is known:
      # it confirms that the precompiled Emacs actually
      # contains Tree-sitter support.
      #
      - name: Verify precompiled Emacs tree-sitter linkage
        if: "!matrix.emacs-source"
        run: |
          EMACS_BIN=$(which emacs)

          echo "Emacs binary: $EMACS_BIN"

          LDD_OUT=$(ldd "$EMACS_BIN" | grep libtree-sitter || true)

          echo "tree-sitter linkage:"
          echo "$LDD_OUT"

          if [ -z "$LDD_OUT" ]; then
            echo "Warning: no libtree-sitter linkage found in ldd."
            echo "The binary may load Tree-sitter another way."
          fi

      # -------------------------
      # Install tree-sitter CLI
      # -------------------------
      - name: Install tree-sitter CLI
        run: |
          npm install -g \
            tree-sitter-cli@${{ matrix.tree-sitter-version }}

      # -------------------------
      # Verify tree-sitter CLI
      # -------------------------
      - name: Verify tree-sitter CLI
        run: |
          tree-sitter --version

      # -------------------------
      # Build tree-sitter-fortran
      # -------------------------
      - name: Build tree-sitter-fortran
        run: |
          git clone \
            --depth 1 \
            --single-branch \
            --branch master \
            https://github.com/mscfd/tree-sitter-fortran.git

          cd tree-sitter-fortran

          echo "Grammar commit: $(git rev-parse HEAD)"

          tree-sitter generate

          cc -fPIC -c src/parser.c

          cc -fPIC -c src/scanner.c 2>/dev/null || true

          cc -shared parser.o scanner.o \
            -o libtree-sitter-fortran.so || \
          cc -shared parser.o \
            -o libtree-sitter-fortran.so

          mkdir -p ~/.emacs.d/tree-sitter

          cp \
            libtree-sitter-fortran.so \
            ~/.emacs.d/tree-sitter/

      # -------------------------
      # Verify tree-sitter ABI
      # -------------------------
      - name: Verify tree-sitter ABI
        run: |
          emacs --batch -Q \
            --eval "(progn
              (add-to-list
               'treesit-extra-load-path
               \"~/.emacs.d/tree-sitter\")

              (let ((lib
                     (treesit-library-abi-version))
                    (lang
                     (treesit-language-abi-version 'fortran)))

                (princ
                 (format
                  \"Emacs: %s\nlib ABI: %s\nlang ABI: %s\n\"
                  emacs-version
                  lib
                  lang))

                (unless (= lib 15)
                  (error
                   \"Unexpected tree-sitter library ABI: %s\"
                   lib))

                (unless (= lang 15)
                  (error
                   \"Unexpected Fortran language ABI: %s\"
                   lang))))"

      # -------------------------
      # Run checks + tests
      # -------------------------
      - name: Run checks (targeted files)
        run: |
          make test-checkdoc
          make test-byte-compile
          make test-ert-all
